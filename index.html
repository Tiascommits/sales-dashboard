<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KAM Performance Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* Layout: sticky header with page tabs and filter bar, content in a centred 1280px column of cards. Navy and blue on a cool light ground. */
:root{
  --bg:#F4F6FA; --panel:#FFFFFF; --fg:#0F1F3D; --fg-muted:#566683; --line:#E0E6F0; --soft:#EAF0FB;
  --navy:#0B2A5B; --blue:#2F6FDE; --sky:#8DB8F5;
  --good:#0B7A4B; --good-bg:#E2F4EA; --warn:#8A5700; --warn-bg:#FFF0D1; --bad:#B42318; --bad-bg:#FDE6E3; --info-bg:#EAF0FB;
  --otc:#0B2A5B; --saas:#2F6FDE; --mrr:#2BB3D6; --target:#C98A00;
  --k1:#0B2A5B; --k2:#2F6FDE; --k3:#7FB2F0; --k4:#0F9D8A; --k5:#7B61C9; --k6:#8794A8; --k7:#C2410C;
  --font:'Public Sans','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --panel:#121C31; --fg:#E8EEF9; --fg-muted:#9DABC6; --line:#25334F; --soft:#1A2744;
  --navy:#A9C2F3; --blue:#5B93F7; --sky:#35538F;
  --good:#4CC38A; --good-bg:#12372A; --warn:#F0B24A; --warn-bg:#3B2D0E; --bad:#FF8A7E; --bad-bg:#46201C; --info-bg:#1A2744;
  --otc:#A9C2F3; --saas:#5B93F7; --mrr:#3CC3E6; --target:#F0B24A;
  --k1:#A9C2F3; --k2:#5B93F7; --k3:#35538F; --k4:#3CC3B0; --k5:#A592E8; --k6:#8794A8; --k7:#F59E6A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1222; --panel:#121C31; --fg:#E8EEF9; --fg-muted:#9DABC6; --line:#25334F; --soft:#1A2744;
  --navy:#A9C2F3; --blue:#5B93F7; --sky:#35538F;
  --good:#4CC38A; --good-bg:#12372A; --warn:#F0B24A; --warn-bg:#3B2D0E; --bad:#FF8A7E; --bad-bg:#46201C; --info-bg:#1A2744;
  --otc:#A9C2F3; --saas:#5B93F7; --mrr:#3CC3E6; --target:#F0B24A;
  --k1:#A9C2F3; --k2:#5B93F7; --k3:#35538F; --k4:#3CC3B0; --k5:#A592E8; --k6:#8794A8; --k7:#F59E6A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:20px 0 10px}
h1{font-size:24px;line-height:1.15;margin:0;color:var(--navy);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--fg-muted);font-size:12.5px;margin-top:4px;max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--fg)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--navy);color:var(--bg);border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0A1222}
:root[data-theme="light"] .btn.primary{color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;white-space:nowrap;color:var(--fg-muted);font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:14px 0}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.filters select,.filters input[type=date]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:130px;text-transform:none;letter-spacing:0;font-weight:500}
.banner{background:var(--info-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14.5px;font-weight:650;color:var(--fg)}
.card .note{color:var(--fg-muted);font-size:12px;margin:0 0 10px}
.kpi{padding:14px 16px}
.kpi .lbl{font-size:11.5px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .meta{font-size:12px;color:var(--fg-muted);margin-top:2px;min-height:17px}
.kpi.hero{background:#0B2A5B;border-color:#0B2A5B}
:root[data-theme="dark"] .kpi.hero{background:#1B3A7A;border-color:#1B3A7A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.hero{background:#1B3A7A;border-color:#1B3A7A}}
.kpi.hero .lbl,.kpi.hero .meta{color:#D5E1F8}.kpi.hero .val{color:#fff}
.chartbox{position:relative;height:270px}
.chartbox.tall{height:340px}
.up{color:var(--good)}.down{color:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--navy)}.pill.mute{background:var(--soft);color:var(--fg-muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--fg-muted);font-weight:650;text-transform:uppercase;letter-spacing:.03em;background:var(--panel);position:sticky;top:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.zero td{background:var(--bad-bg)}
tr.total td{font-weight:700;border-top:2px solid var(--line)}
.kcards{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.kc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.kc:hover{border-color:var(--blue)}.kc.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--soft)}
.kc .nm{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:650}
.kc .big{font-size:20px;font-weight:700;color:var(--navy);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar.good>i{background:var(--good)}.bar.warn>i{background:var(--target)}.bar.bad>i{background:var(--bad)}
.kc .sm{font-size:12px;color:var(--fg-muted);display:flex;justify-content:space-between;gap:8px}
.ins{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ins li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ins .t{font-weight:600}.ins .a{color:var(--fg-muted);font-size:13px;margin-top:2px}
.sec{margin:22px 0 10px;font-size:15px;color:var(--navy);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0}
.chk input{width:16px;height:16px}
.rules{display:grid;gap:4px 24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.small{font-size:12px;color:var(--fg-muted)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.mapgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-muted);font-weight:600}
.mapgrid select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12px}
.hide{display:none!important}
.ok{color:var(--good);font-weight:700}.fail{color:var(--bad);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media (max-width:640px){h1{font-size:20px}.kpi .val{font-size:22px}.chartbox{height:240px}}
</style>

  <div id="banners"></div>

</div>

/* ========================= HELPERS ========================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nfIN=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const sgn=v=>v<0?'-':'';
const taka=v=>sgn(v)+'৳'+nfIN.format(Math.abs(Math.round(v||0)));
function takaC(v){v=v||0;const a=Math.abs(v);if(a>=1e7)return sgn(v)+'৳'+(a/1e7).toFixed(2)+' Cr';if(a>=1e5)return sgn(v)+'৳'+(a/1e5).toFixed(2)+' L';return sgn(v)+'৳'+nfIN.format(Math.round(a));}
const pct=v=>(v==null||!isFinite(v))?'n/a':v.toFixed(2)+'%';
const spct=v=>(v==null||!isFinite(v))?'n/a':(v>0?'+':'')+v.toFixed(2)+'%';
const num=v=>nfIN.format(Math.round(v||0));
const div=(a,b)=>(b>0?a/b:null);
const ym=d=>d.slice(0,7);
const mLabel=m=>MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4);
const lastDay=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const iso=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
function addMonth(m,k){const y=+m.slice(0,4),mo=+m.slice(5,7)-1+k;const yy=y+Math.floor(mo/12);const mm=((mo%12)+12)%12+1;return yy+'-'+String(mm).padStart(2,'0');}
function monthRange(a,b){const out=[];for(let m=a;m<=b;m=addMonth(m,1))out.push(m);return out;}
const Z=()=>({n:0,otc:0,saas:0,mrr:0,total:0});
function add(a,r){a.n++;a.otc+=r.otc;a.saas+=r.saas;a.mrr+=r.mrr;a.total+=r.total;return a;}
const agg=rows=>rows.reduce(add,Z());
function groupBy(rows,key){const m=new Map();for(const r of rows){const k=key(r);if(!m.has(k))m.set(k,Z());add(m.get(k),r);}return m;}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function parseNum(v){if(v==null||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:NaN;const x=Number(String(v).replace(/[,৳\s]/g,''));return isFinite(x)?x:NaN;}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;const r=new Date(Math.round(v.getTime()/60000)*60000);const d=new Date(r.getTime()-r.getTimezoneOffset()*60000);return d.toISOString().slice(0,10);}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return iso(m[3],+m[2],+m[1]);
  const d=new Date(s);if(!isNaN(d))return iso(d.getFullYear(),d.getMonth()+1,d.getDate());
  return null;
}
function tip(el){return el;}

/* ========================= NORMALISE ========================= */
function normalise(){
  const roster=new Set([...ROSTER,...SRC.targets.filter(t=>t.level==='KAM').map(t=>t.name)]);
  S.roster=[...roster].filter(k=>k!==UN).sort();
  const seenCust=new Map(); // earliest creation date per customer, any non-cancelled order
  S.all=SRC.rows.map(r=>{
    const kamRaw=(r.kam||'').trim();const al=MAP.kam[kamRaw];let kam=al!==undefined?al:kamRaw;
    if(!kam||!roster.has(kam))kam=UN;
    const chRaw=(r.ch||'').trim();let ch=chRaw?(MAP.channel[chRaw]||chRaw):'Unassigned';
    const bad=[r.otc,r.saas,r.mrr].some(v=>typeof v==='number'&&isNaN(v));
    const otc=isFinite(r.otc)?r.otc:0,saas=isFinite(r.saas)?r.saas:0,mrr=isFinite(r.mrr)?r.mrr:0;
    const date=r.date||null;
    const row={id:r.id,cust:(r.cust||'').trim(),kam,kamRaw,ch,chRaw,status:r.status||'(blank)',ticket:r.ticket||'(blank)',date,m:date?ym(date):null,
      otc,saas,mrr,total:otc+saas,pkg:r.pkg||'',created:r.created||date,badNum:bad};
    if(row.cust&&row.status!=='Cancelled'&&row.created){const k=row.cust.toLowerCase();const c=seenCust.get(k);if(!c||row.created<c)seenCust.set(k,row.created);}
    return row;
  });
  S.firstSeen=seenCust;
  S.tIdx={};
  for(const t of SRC.targets){const L=t.level||'KAM';((S.tIdx[L]??={})[t.month]??={})[t.name]=t;}
  applyRules();
}
function qualifies(r){
  return !!r.date&&r.date>=CFG.start&&CFG.tickets.has(r.ticket)&&CFG.orders.has(r.status)&&!(CFG.excludeSupport&&r.chRaw==='Support Request');
}
function applyRules(){
  S.q=S.all.filter(qualifies);
  const asOf=S.asOf;const maxM=ym(asOf);
  const have=S.q.map(r=>r.m);
  const tm=SRC.targets.map(t=>t.month);
  const first=[CFG.start.slice(0,7),...have,...tm].sort()[0];
  const last=[maxM,...have,...tm].sort().slice(-1)[0];
  S.months=monthRange(first,last);
}

/* ========================= TARGETS ========================= */
function tget(level,m,name){return S.tIdx[level]&&S.tIdx[level][m]&&S.tIdx[level][m][name]||null;}
function monthTarget(m,kam,ch){
  const sumLevel=L=>{const o=S.tIdx[L]&&S.tIdx[L][m];if(!o)return null;const a={wo:0,otc:0,saas:0,mrr:0,total:0};for(const t of Object.values(o)){a.wo+=t.wo||0;a.otc+=t.otc||0;a.saas+=t.saas||0;a.mrr+=t.mrr||0;a.total+=t.total||0;}return a;};
  if(kam!=='all'&&ch!=='all')return null;
  if(kam!=='all'){const t=tget('KAM',m,kam);return t&&S.tIdx.KAM[m]?{wo:t.wo||0,otc:t.otc||0,saas:t.saas||0,mrr:t.mrr||0,total:t.total||0}:null;}
  if(ch!=='all'){const t=tget('Channel',m,ch);return t?{wo:t.wo||0,otc:t.otc||0,saas:t.saas||0,mrr:t.mrr||0,total:t.total||0}:null;}
  return sumLevel('KAM')||sumLevel('Channel');
}
/* target over the months of a period; actuals counted only for months that have a target */
function periodTarget(P,kam,ch){
  let t=null;const covered=[];
  for(const m of P.months){const x=monthTarget(m,kam,ch);if(x){t=t||{wo:0,otc:0,saas:0,mrr:0,total:0};for(const k in x)t[k]+=x[k];covered.push(m);}}
  return {t,covered};
}

/* ========================= PERIOD AND FILTERED ROWS ========================= */
function period(){
  let from=F.from,to=F.to;
  if(!from&&!to){const m=F.month||S.months[S.months.length-1];from=m+'-01';to=m+'-'+String(lastDay(m)).padStart(2,'0');}
  if(!from)from=CFG.start;if(!to)to=S.asOf>from?S.asOf:from;
  if(from>to){const t=from;from=to;to=t;}
  const months=monthRange(ym(from),ym(to));
  const ref=months[months.length-1];
  const partial=(S.asOf<=to&&ym(S.asOf)===ref&&S.asOf<ref+'-'+String(lastDay(ref)).padStart(2,'0'))||false;
  const label=(months.length===1&&from===months[0]+'-01'&&to>=months[0]+'-'+String(lastDay(months[0])).padStart(2,'0')||months.length===1&&partial)?mLabel(months[0])+(partial?' (month to date)':''):from+' to '+to;
  const dayN=+S.asOf.slice(8,10),dim=lastDay(ref);
  return {from,to,months,ref,partial,label,elapsed:partial?dayN/dim:1,dayN,dim};
}
function rowsFor(P,o={}){
  const kam=o.kam!==undefined?o.kam:F.kam,ch=o.ch!==undefined?o.ch:F.ch;
  return S.q.filter(r=>r.date>=P.from&&r.date<=P.to&&(kam==='all'||r.kam===kam)&&(ch==='all'||r.ch===ch));
}
function rowsMonth(m,o={}){
  const kam=o.kam!==undefined?o.kam:F.kam,ch=o.ch!==undefined?o.ch:F.ch;
  return S.q.filter(r=>r.m===m&&(kam==='all'||r.kam===kam)&&(ch==='all'||r.ch===ch));
}
function monthSeries(o={}){return S.months.map(m=>({m,a:agg(rowsMonth(m,o)),t:monthTarget(m,o.kam!==undefined?o.kam:F.kam,o.ch!==undefined?o.ch:F.ch)}));}
const isPartialMonth=m=>ym(S.asOf)===m&&S.asOf<m+'-'+String(lastDay(m)).padStart(2,'0');
function kamStatus(ach,wo,elapsed){
  if(wo===0)return {cls:'bad',txt:'No work orders'};
  if(ach==null)return {cls:'mute',txt:'No target'};
  if(ach>=100)return {cls:'good',txt:'Target achieved'};
  if(ach>=60*elapsed)return {cls:'warn',txt:elapsed<1?'On pace':'Moderate'};
  return {cls:'bad',txt:'Below target'};
}

/* ========================= CHARTS ========================= */
function theme(){return{fg:cssv('--fg-muted'),grid:cssv('--line'),ink:cssv('--fg'),otc:cssv('--otc'),saas:cssv('--saas'),mrr:cssv('--mrr'),target:cssv('--target'),
  k:['--k1','--k2','--k3','--k4','--k5','--k6','--k7'].map(cssv),good:cssv('--good'),bad:cssv('--bad'),panel:cssv('--panel')};}
function chart(id,cfg){
  const el=document.getElementById(id);if(!el)return;
  if(charts[id]){charts[id].destroy();delete charts[id];}
  const T=theme();Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.color=T.fg;Chart.defaults.borderColor=T.grid;
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false}},cfg.options||{});
  cfg.options.plugins=Object.assign({legend:{position:'bottom',labels:{boxWidth:12,color:T.fg}}},cfg.options.plugins||{});
  charts[id]=new Chart(el,cfg);
}
const yMoney={ticks:{callback:v=>takaC(v)},grid:{color:()=>cssv('--line')}};
const tipMoney={callbacks:{label:c=>' '+c.dataset.label+': '+(c.dataset.isPct?pct(c.parsed.y):c.dataset.isNum?num(c.parsed.y):taka(c.parsed.y))}};
const tipH={callbacks:{label:c=>' '+c.dataset.label+': '+taka(c.parsed.x)}};
const mlab=m=>mLabel(m)+(isPartialMonth(m)?' (MTD)':'');
const box=(id,cls='')=>`<div class="chartbox ${cls}"><canvas id="${id}" role="img" aria-label="${id}"></canvas></div>`;
function kpi(lbl,val,meta,cls=''){return `<div class="card kpi ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="meta">${meta||''}</div></div>`;}
function table(cols,rows,opts={}){
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.l?'l':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r._cls||''}" ${r._attr||''}>${cols.map(c=>`<td class="${c.l?'l':''}">${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ========================= PAGE 1: OVERVIEW ========================= */
function renderOverview(){
  const P=period();const rows=rowsFor(P);const a=agg(rows);
  const {t,covered}=periodTarget(P,F.kam,F.ch);
  const actCov=covered.length?agg(rows.filter(r=>covered.includes(r.m))):null;
  const ach=t&&t.total>0?actCov.total/t.total*100:null;
  const gap=t?t.total-(actCov?actCov.total:0):null;
  const cur=agg(rowsMonth(P.ref)),prev=agg(rowsMonth(addMonth(P.ref,-1)));
  const mom=prev.total>0?(cur.total-prev.total)/prev.total*100:null;
  let lfl=null;
  if(P.partial){const pm=addMonth(P.ref,-1),d=P.dayN;const p2=agg(S.q.filter(r=>r.m===pm&&+r.date.slice(8,10)<=d&&(F.kam==='all'||r.kam===F.kam)&&(F.ch==='all'||r.ch===F.ch)));lfl={prev:p2,g:p2.total>0?(cur.total-p2.total)/p2.total*100:null,d};}
  const momTxt=mom==null?'n/a':spct(mom);
  const tgtNote=t?(covered.length<P.months.length?'Target covers '+covered.map(mLabel).join(', ')+' only':(F.kam!=='all'?'KAM target':F.ch!=='all'?'Channel target':'Sum of KAM targets')):(F.kam!=='all'&&F.ch!=='all'?'No target at KAM and channel level':'No target loaded for this period');
  $('#p-overview').innerHTML=`
  <div class="grid kpis">
    ${kpi('Total WO value',takaC(a.total),taka(a.total)+' (OTC + SaaS)','hero')}
    ${kpi('Total WO quantity',num(a.n),'Qualifying work orders')}
    ${kpi(P.months.length>1?'Period target':'Monthly target',t?takaC(t.total):'n/a',tgtNote)}
    ${kpi('Target achievement',pct(ach),ach==null?'Needs a target for the period':(P.partial?'Month to date, '+pct(P.elapsed*100)+' of month elapsed':'Of target'))}
    ${kpi('Remaining target gap',gap==null?'n/a':(gap>0?takaC(gap):'Target met'),gap==null?'':gap>0?'Still to win':(takaC(-gap)+' above target'))}
    ${kpi('OTC revenue',takaC(a.otc),taka(a.otc)+' (devices and one-time)')}
    ${kpi('SaaS revenue',takaC(a.saas),taka(a.saas)+' (API included)')}
    ${kpi('MRR',takaC(a.mrr),'Recurring, not added to total')}
    ${kpi('Average WO value',a.n?takaC(a.total/a.n):'n/a','Total WO value / WO count')}
    ${kpi('Month on month growth',momTxt,mom==null?(prev.total===0?'No previous month value':''):mLabel(P.ref)+' vs '+mLabel(addMonth(P.ref,-1)))}
  </div>
  ${lfl?`<div class="banner warn">${mLabel(P.ref)} is a month in progress (day ${P.dayN} of ${P.dim}), so month on month growth against a full month is misleading. Like for like, days 1 to ${lfl.d} of ${mLabel(addMonth(P.ref,-1))} were ${taka(lfl.prev.total)} against ${taka(cur.total)} now (${lfl.g==null?'n/a':spct(lfl.g)}).</div>`:''}
  <div class="grid two">
    <div class="card"><h3>Actual revenue vs target</h3><p class="note">Total WO value against the assigned target for each month. Months without a target show actuals only.</p>${box('cOvT')}</div>
    <div class="card"><h3>Monthly revenue trend</h3><p class="note">Total WO value (OTC + SaaS). The latest bar is month to date.</p>${box('cOvTrend')}</div>
    <div class="card"><h3>Revenue composition</h3><p class="note">OTC, SaaS and MRR shown separately. MRR is a recurring metric and is not part of Total WO value.</p>${box('cOvComp')}</div>
    <div class="card"><h3>Monthly WO quantity</h3><p class="note">Qualifying work orders per month.</p>${box('cOvQty')}</div>
    <div class="card" style="grid-column:1/-1"><h3>Revenue contribution by business category</h3><p class="note">${esc(P.label)}. Sales channel is used as the business category because the export has no product category column.</p><div id="chShare"></div></div>

    options:{scales:{y:yMoney},plugins:{tooltip:tipMoney}}});
  chart('cOvTrend',{type:'line',data:{labels,datasets:[{label:'Total WO value',data:ms.map(x=>x.a.total),borderColor:T.otc,backgroundColor:T.otc+'22',fill:true,tension:0,pointRadius:4,borderWidth:2.5}]},

    {label:'OTC',data:ms.map(x=>x.a.otc),backgroundColor:T.otc,borderRadius:3},
    {label:'SaaS',data:ms.map(x=>x.a.saas),backgroundColor:T.saas,borderRadius:3},
    {label:'MRR',data:ms.map(x=>x.a.mrr),backgroundColor:T.mrr,borderRadius:3}]},

  $('#chShare').innerHTML=table([
    {h:'Category',l:true,f:r=>`<span class="dot" style="background:${r.c}"></span>${esc(r.ch)}`},

    {h:'Share',f:r=>`<div style="min-width:130px;display:flex;align-items:center;gap:8px;justify-content:flex-end"><div class="bar" style="width:80px;margin:0"><i style="width:${(r.share||0)*100}%;background:${r.c}"></i></div>${pct(r.share==null?null:r.share*100)}</div>`}],list);
}

/* ========================= PAGE 2: KAM ========================= */
function kamRows(P,ch){
  const rows=S.q.filter(r=>r.date>=P.from&&r.date<=P.to&&(ch==='all'||r.ch===ch));
  const g=groupBy(rows,r=>r.kam);
  return S.roster.map(k=>{
    const a=g.get(k)||Z();let {t,covered}=periodTarget(P,k,ch);if(t&&!(t.total>0))t=null;
    const act=covered.length?agg(rows.filter(r=>r.kam===k&&covered.includes(r.m))):Z();
    const ach=t&&t.total>0?act.total/t.total*100:null;
    return {kam:k,...a,target:t?t.total:null,tgt:t,ach,gap:t?t.total-act.total:null,avg:a.n?a.total/a.n:null,st:kamStatus(ach,a.n,P.elapsed)};
  }).sort((x,y)=>y.total-x.total||x.kam.localeCompare(y.kam));
}

  const avgM=ms.map(x=>x.a.n?x.a.total/x.a.n:null);
  const nr=ms.map(x=>{const rs=rowsMonth(x.m);const ms0=x.m+'-01';let nw=Z(),rp=Z();for(const r of rs){const fs=r.cust&&S.firstSeen.get(r.cust.toLowerCase());(fs&&fs<ms0?rp:nw).n++;((fs&&fs<ms0)?rp:nw).total+=r.total;}return {nw,rp};});

  chart('cGrNew',{type:'bar',data:{labels,datasets:[{label:'New customers',data:nr.map(x=>x.nw.total),backgroundColor:T.saas},{label:'Repeat customers',data:nr.map(x=>x.rp.total),backgroundColor:T.otc}]},options:{scales:{x:{stacked:true},y:Object.assign({stacked:true},yMoney)},plugins:{tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+taka(c.parsed.y)+' ('+num((c.datasetIndex===0?nr[c.dataIndex].nw:nr[c.dataIndex].rp).n)+' WOs)'}}}}});

/* ========================= PAGE 5: ACTIONS ========================= */
function renderActions(){
  const P=period();const ch=F.ch;const list=kamRows(P,ch);const pm=addMonth(P.ref,-1);
  list.forEach((x,i)=>x.rank=i+1);
  const gPrev=groupBy(S.q.filter(r=>r.m===pm&&(ch==='all'||r.ch===ch)),r=>r.kam),gCur=groupBy(S.q.filter(r=>r.m===P.ref&&(ch==='all'||r.ch===ch)),r=>r.kam);
  const tot=agg(rowsFor(P,{kam:'all'}));const tt=periodTarget(P,'all',ch);
  const actCov=tt.covered.length?agg(rowsFor(P,{kam:'all'}).filter(r=>tt.covered.includes(r.m))):null;
  const gap=tt.t&&actCov?tt.t.total-actCov.total:null;
  const active=list.filter(x=>x.n>0);

function checks(){

  const dups=[...ids.entries()].filter(([,c])=>c>1);

  out.push({k:'Months with no target',n:noT.length,sev:noT.length?'warn':'good',d:noT.length?noT.map(mLabel).join(', ')+' have work orders but no loaded target, so achievement is n/a there.':'Every month with work orders has a target.'});

  out.push({k:'KAMs with work orders but no target',n:noKT.length,sev:noKT.length?'warn':'good',d:noKT.length?noKT.join(', ')+' (shown as no target).':'All KAMs with work orders have a target in at least one month.'});
  const badN=all.filter(r=>r.badNum&&qualifies(r));out.push({k:'Missing or invalid revenue values',n:badN.length,sev:badN.length?'bad':'good',d:badN.length?'Non numeric amounts were read as 0: '+badN.slice(0,5).map(r=>r.id).join(', '):'All OTC, SaaS and MRR cells are numeric.'});

  const neg=q.filter(r=>r.otc<0||r.saas<0);out.push({k:'Negative amounts',n:neg.length,sev:neg.length?'bad':'good',d:neg.length?neg.slice(0,5).map(r=>r.id).join(', '):'None among counted orders.'});
  const noDate=all.filter(r=>!r.date&&CFG.tickets.has(r.ticket)&&!(CFG.excludeSupport&&r.chRaw==='Support Request'));
  out.push({k:'Missing or unreadable dates',n:noDate.length,sev:noDate.length?'warn':'good',d:noDate.length?`${num(noDate.length)} otherwise qualifying orders have no reporting date and are left out: `+noDate.slice(0,5).map(r=>r.id).join(', '):'Every otherwise qualifying order has a reporting date.'});

  out.push({k:'Inconsistent monthly totals',n:bad.length,sev:bad.length?'bad':'good',d:bad.length?bad.join(', '):'Monthly totals equal the sum of KAMs and the sum of categories in every month.'});

  return out;
}

async function readSheet(file){

function detect(headers,hints){
  const low=headers.map(h=>String(h).trim().toLowerCase());
  for(const h of hints){const i=low.indexOf(h);if(i>=0)return headers[i];}
  for(const h of hints){const i=low.findIndex(x=>x.includes(h));if(i>=0)return headers[i];}
  return '';
}
async function handleRowsFile(f){
  if(!f)return;const msg=$('#upMsg');msg.textContent='Reading '+f.name+' ...';
  try{
    const rows=await readSheet(f);if(!rows.length){msg.textContent='The file has no rows.';return;}
    const headers=Object.keys(rows[0]);PENDING={rows,headers,name:f.name};
    const map={};FIELD_DEFS.forEach(d=>map[d.k]=detect(headers,d.hints));
    // plain "status" hint must not grab "Ticket Status"
    if(map.status&&map.status===map.ticket){const alt=headers.find(h=>String(h).trim().toLowerCase()==='status');map.status=alt||'';}
    $('#mapBox').innerHTML=`<p class="small" style="margin-top:12px">Check how the columns in <b>${esc(f.name)}</b> map to the dashboard fields. Required fields are marked.</p><div class="mapgrid">${FIELD_DEFS.map(d=>`<label>${esc(d.label)}${d.req?' *':''}<select data-f="${d.k}"><option value="">(not in file)</option>${headers.map(h=>`<option ${h===map[d.k]?'selected':''} value="${esc(h)}">${esc(h)}</option>`).join('')}</select></label>`).join('')}</div><div style="margin-top:10px"><button class="btn primary" id="btnApply" type="button">Apply mapping and load ${num(rows.length)} rows</button></div>`;
    msg.textContent='';
    $('#btnApply').onclick=applyMapping;
  }catch(err){msg.textContent='Could not read the file: '+err.message;}
}
async function applyMapping(){
  const map={};document.querySelectorAll('#mapBox select[data-f]').forEach(s=>map[s.dataset.f]=s.value);
  const miss=FIELD_DEFS.filter(d=>d.req&&!map[d.k]).map(d=>d.label);
  if(miss.length){$('#upMsg').textContent='Map these required fields first: '+miss.join(', ');return;}
  const g=(r,k)=>map[k]?r[map[k]]:null;
  const rows=PENDING.rows.map(r=>({id:String(g(r,'id')??'').trim(),date:parseDate(g(r,'date')),kam:g(r,'kam')==null?'':String(g(r,'kam')),
    otc:parseNum(g(r,'otc')),saas:parseNum(g(r,'saas')),mrr:parseNum(g(r,'mrr')),ch:g(r,'ch')==null?'':String(g(r,'ch')),
    ticket:g(r,'ticket')==null?null:String(g(r,'ticket')).trim(),status:g(r,'status')==null?null:String(g(r,'status')).trim(),
    cust:g(r,'cust')==null?'':String(g(r,'cust')),created:parseDate(g(r,'created')),pkg:g(r,'pkg')==null?'':String(g(r,'pkg'))}));
  if(!map.ticket)rows.forEach(r=>r.ticket='SA Done');
  if(!map.status)rows.forEach(r=>r.status='Sales Order');
  const dates=rows.map(r=>r.date).filter(Boolean).sort();
  const parsed={rows,targets:SRC.targets,meta:{name:PENDING.name+' (uploaded)',takenAt:'',asOf:dates.length?dates[dates.length-1]:S.asOf}};
  // add any new status values to the counted lists when columns were missing
  await loadSource('file',parsed);
  $('#upMsg').textContent='Loaded '+num(rows.length)+' rows from '+PENDING.name+'.';
}
async function handleTargetsFile(f){
  if(!f)return;const msg=$('#tMsg');
  try{
    const rows=await readSheet(f);const headers=Object.keys(rows[0]||{});
    const col=h=>detect(headers,h);
    const cM=col(['month','period','date']),cN=col(['name','kam','channel']),cO=col(['otc']),cS=col(['saas']),cR=col(['mrr']),cT=col(['total','target']),cL=col(['level']),cW=col(['wo quantity','wo','quantity']);
    if(!cM||!cN){msg.textContent='Need at least a Month column and a Name (KAM or channel) column.';return;}
    const t=rows.map(r=>{const d=parseDate(r[cM]);let m=d?d.slice(0,7):null;if(!m&&r[cM]){const s=String(r[cM]).trim();const mm=s.match(/^(\d{4})-(\d{2})$/);if(mm)m=s;else{const dd=new Date('1 '+s);if(!isNaN(dd))m=iso(dd.getFullYear(),dd.getMonth()+1,1).slice(0,7);}}
      const otc=parseNum(cO?r[cO]:0)||0,saas=parseNum(cS?r[cS]:0)||0;const total=cT&&r[cT]!=null&&r[cT]!==''?parseNum(r[cT]):otc+saas;
      const lvl=cL&&r[cL]?String(r[cL]).trim():'KAM';
      return {level:/chan/i.test(lvl)?'Channel':'KAM',name:String(r[cN]||'').trim(),month:m,wo:parseNum(cW?r[cW]:0)||0,otc,saas,mrr:parseNum(cR?r[cR]:0)||0,total,source:f.name};}).filter(x=>x.month&&x.name);
    if(!t.length){msg.textContent='No usable target rows found.';return;}
    SRC.targets=t;normalise();fillFilters();renderAll();
    const mm=[...new Set(t.map(x=>x.month))].sort();
    $('#tMsg').textContent='Loaded '+t.length+' target rows for '+mm.map(mLabel).join(', ')+'.';
  }catch(err){msg.textContent='Could not read the file: '+err.message;}
}

/* ========================= FILTERS AND SHELL ========================= */
function fillFilters(){
  const opt=(v,t,sel)=>`<option value="${esc(v)}" ${sel?'selected':''}>${esc(t)}</option>`;
  const lastM=S.months[S.months.length-1];
  if(!F.month&&!F.from&&!F.to)F.month=lastM;
  $('#fMonth').innerHTML=opt('','Custom range',!F.month)+[...S.months].reverse().map(m=>opt(m,mLabel(m)+(isPartialMonth(m)?' (month to date)':''),F.month===m)).join('');
  $('#fKam').innerHTML=opt('all','All KAMs',F.kam==='all')+[...S.roster,UN].map(k=>opt(k,k,F.kam===k)).join('');
  const chs=[...new Set([...CHANNELS,...S.q.map(r=>r.ch)])];
  $('#fCh').innerHTML=opt('all','All categories',F.ch==='all')+chs.map(k=>opt(k,k,F.ch===k)).join('');
  const P=period();$('#fFrom').value=F.from||P.from;$('#fTo').value=F.to||P.to;
}
function setMonth(m){F.month=m;if(m){F.from='';F.to='';}}
function renderBanners(){
  const P=period();const b=[];
  if(P.partial)b.push(`<div class="banner">Showing ${esc(mLabel(P.ref))} as a month in progress: day ${P.dayN} of ${P.dim}. Data as of ${esc(S.asOf)}.</div>`);
  const {t,covered}=periodTarget(P,F.kam,F.ch);
  if(!t&&(currentPage==='overview'||currentPage==='kam'))b.push(`<div class="banner warn">No target is loaded for ${esc(P.label)}${F.kam!=='all'&&F.ch!=='all'?' at KAM and channel level':''}. Achievement and gap show n/a. Targets are loaded for ${[...new Set(SRC.targets.map(x=>x.month))].sort().map(mLabel).join(' and ')||'no months'}; before October 2026 the company set category targets, which you can load in the import page.</div>`);
  else if(t&&covered.length<P.months.length)b.push(`<div class="banner warn">Targets exist only for ${covered.map(mLabel).join(', ')}. Achievement for this range is calculated on those months only.</div>`);
  if(F.ch!=='all'&&currentPage==='kam')b.push(`<div class="banner warn">A category filter is on. KAM targets are not split by category, so KAM achievement is n/a.</div>`);
  $('#banners').innerHTML=b.join('');
}
function renderAll(){
  $('#srcline').textContent=`Source: ${SRC.meta.name}${SRC.meta.takenAt?', exported '+SRC.meta.takenAt:''}. Counting work orders with SA requisition from ${CFG.start}, ticket status ${[...CFG.tickets].join(' or ')}${CFG.excludeSupport?', excluding support requests':''}. Amounts in Bangladeshi Taka.`;
  $('#lblKam').style.opacity=currentPage==='kam'?.45:1;
  renderBanners();
  const fn={overview:renderOverview,kam:renderKam,product:renderProduct,growth:renderGrowth,actions:renderActions,data:renderData}[currentPage];
  try{fn();}catch(err){console.error(err);$('#p-'+currentPage).innerHTML='<div class="banner warn">This page could not be drawn: '+esc(err.message)+'</div>';}
}
function show(page,fromHash){
  currentPage=page;
  document.querySelectorAll('[data-pg]').forEach(s=>s.classList.toggle('hide',s.id!=='p-'+page));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===page?'true':'false'));
  $('#filters').classList.toggle('hide',page==='data');
  if(!fromHash){try{history.replaceState(null,'','#'+page);}catch(e){location.hash=page;}}
  renderAll();
}
async function loadSource(name,arg){
  const res=await DataSources[name].load(arg);
  SRC={rows:res.rows,targets:res.targets,meta:res.meta||{}};
  S.asOf=SRC.meta.asOf||S.asOf;
  // uploaded files may carry status values the defaults do not know; keep counted sets as is unless columns were absent
  normalise();
  const present=new Set(S.all.map(r=>r.ticket));if(![...CFG.tickets].some(t=>present.has(t))){CFG.tickets=new Set(present);applyRules();}
  F.kam='all';F.ch='all';F.from='';F.to='';F.month='';
  fillFilters();renderAll();
}
function initEvents(){
  $('#tabs').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)show(b.dataset.page);};
  $('#fMonth').onchange=e=>{setMonth(e.target.value);fillFilters();renderAll();};
  $('#fFrom').onchange=e=>{if(!e.target.value)return;F.from=e.target.value;F.month='';if(!F.to)F.to=S.asOf;fillFilters();renderAll();};
  $('#fTo').onchange=e=>{if(!e.target.value)return;F.to=e.target.value;F.month='';if(!F.from)F.from=CFG.start;fillFilters();renderAll();};
  $('#fKam').onchange=e=>{F.kam=e.target.value;renderAll();};
  $('#fCh').onchange=e=>{F.ch=e.target.value;renderAll();};
  $('#fReset').onclick=()=>{F.kam='all';F.ch='all';F.from='';F.to='';F.month='';fillFilters();renderAll();};
  $('#btnRules').onclick=()=>show('data');
  $('#btnTheme').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',dark?'light':'dark');renderAll();};
  matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>renderAll());
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['overview','kam','product','growth','actions','data'].includes(h)&&h!==currentPage)show(h,true);});
  let rt;window.addEventListener('resize',()=>{});
}
(async function boot(){
  initEvents();
  await loadSource('embedded');
  const h=location.hash.slice(1);
  if(['overview','kam','product','growth','actions','data'].includes(h))show(h,true);
})();
</script>
